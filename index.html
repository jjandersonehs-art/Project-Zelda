<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PROJECT ZELDA // NEURAL COUNCIL WAR ROOM v1.5 TURBO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyber-yellow: #FCEE0A;
      --cyber-cyan: #00F0FF;
      --cyber-red: #FF003C;
      --bg-obsidian: #06060A;
    }
    body {
      background-color: var(--bg-obsidian);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
        linear-gradient(rgba(252, 238, 10, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
      color: #E2E8F0;
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }
    .cyber-clip {
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    }
    .cyber-clip-sm {
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    }
  </style>
</head>
<body class="h-screen flex flex-col select-none">

  <!-- TOP COMMAND BAR -->
  <header class="border-b border-cyan-500/30 bg-[#080911]/95 px-4 py-2.5 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-3 h-8 bg-[#FCEE0A] shadow-[0_0_12px_#FCEE0A]"></div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-orbitron text-base md:text-lg font-black tracking-wider text-white">
            PROJECT ZELDA <span class="text-[#00F0FF]">// WAR ROOM</span>
          </h1>
          <span class="text-[10px] font-mono-code bg-[#00F0FF]/20 text-[#00F0FF] border border-[#00F0FF]/50 px-1.5 py-0.5 uppercase">
            TURBO v1.5
          </span>
        </div>
        <p class="text-xs text-slate-400 tracking-wide">
          CACHED ENDPOINTS • PARALLEL SWARM • YT7360B (AC8258)
        </p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="clearModelCache()" class="cyber-clip-sm bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 text-xs font-bold px-2.5 py-1.5 tracking-wider" title="Re-scan models if needed">
        <i class="fa-solid fa-rotate"></i>
      </button>
      <button onclick="openRelayModal()" class="cyber-clip-sm bg-slate-800 hover:bg-slate-700 border border-yellow-400/50 text-[#FCEE0A] text-xs font-bold px-3 py-1.5 tracking-wider flex items-center gap-1.5">
        <i class="fa-solid fa-share-nodes"></i>
        <span class="hidden sm:inline">SYNC PACKET</span>
      </button>
      <button onclick="toggleModal('settings-modal')" class="cyber-clip-sm bg-[#00F0FF] text-black font-orbitron font-bold text-xs px-3 py-1.5 tracking-wider flex items-center gap-1.5">
        <i class="fa-solid fa-key"></i>
        <span>API KEYS</span>
      </button>
    </div>
  </header>

  <!-- DISPATCH TARGET BAR -->
  <div class="bg-[#0B0D18] border-b border-slate-800 px-4 py-2 flex flex-wrap items-center justify-between gap-2 shrink-0 text-xs">
    <div class="flex items-center gap-1.5 flex-wrap">
      <button onclick="setTarget('PARALLEL')" id="target-PARALLEL" class="target-btn px-2.5 py-1 font-bold tracking-wider bg-[#FCEE0A] text-black cyber-clip-sm">
        ⚡ ALL 3 PARALLEL (FASTEST)
      </button>
      <button onclick="setTarget('ROUNDTABLE')" id="target-ROUNDTABLE" class="target-btn px-2.5 py-1 font-bold tracking-wider bg-slate-900 text-slate-200 border border-slate-700 cyber-clip-sm">
        🔗 CHAIN (G → CLAUDE → GROK)
      </button>
      <button onclick="setTarget('G')" id="target-G" class="target-btn px-2.5 py-1 font-bold tracking-wider bg-slate-900 text-cyan-400 border border-cyan-500/40 cyber-clip-sm">
        ONLY G
      </button>
      <button onclick="setTarget('CLAUDE')" id="target-CLAUDE" class="target-btn px-2.5 py-1 font-bold tracking-wider bg-slate-900 text-amber-400 border border-amber-500/40 cyber-clip-sm">
        ONLY CLAUDE
      </button>
      <button onclick="setTarget('GROK')" id="target-GROK" class="target-btn px-2.5 py-1 font-bold tracking-wider bg-slate-900 text-purple-400 border border-purple-500/40 cyber-clip-sm">
        ONLY GROK
      </button>
    </div>
    <button onclick="clearChat()" class="text-xs font-mono-code text-rose-400 hover:underline">
      <i class="fa-solid fa-trash-can"></i> Reset Log
    </button>
  </div>

  <!-- CHAT STREAM -->
  <main id="chat-stream" class="flex-1 overflow-y-auto p-4 space-y-4 select-text"></main>

  <!-- QUICK PROMPTS -->
  <div class="bg-[#080911] border-t border-slate-800/80 px-4 py-1.5 flex items-center gap-2 overflow-x-auto shrink-0">
    <button onclick="quickPrompt('Give me a fast 2-sentence check-in with your cached model ID.')" class="text-xs bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300 px-2.5 py-1 rounded shrink-0">
      ⚡ Speed Ping
    </button>
    <button onclick="quickPrompt('Review our YT7360B (AC8258) Android 10 head unit specs and Vgate iCar Pro 2S BLE 5.2 polling loop. What edge cases should we lock down first?')" class="text-xs bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300 px-2.5 py-1 rounded shrink-0">
      🔧 AC8258 + Vgate 2S Audit
    </button>
    <button onclick="quickPrompt('Design Zelda Phase 2: How should her independent first-person persona and baseline anomaly detection work on the 13.6-inch screen?')" class="text-xs bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300 px-2.5 py-1 rounded shrink-0">
      🧠 Zelda Sentient Core
    </button>
  </div>

  <!-- INPUT BAR -->
  <footer class="p-3 bg-[#0A0C16] border-t border-cyan-500/30 shrink-0">
    <div class="max-w-6xl mx-auto flex gap-2">
      <textarea id="user-input" rows="2" placeholder="Command the Council (J)..."
        class="flex-1 bg-[#05060B] border border-slate-700 focus:border-[#00F0FF] p-2.5 text-sm text-white placeholder-slate-500 focus:outline-none resize-none"
        onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendUserMessage();}"></textarea>
      <button onclick="sendUserMessage()" class="cyber-clip bg-[#00F0FF] hover:bg-cyan-300 text-black font-orbitron font-black px-6 text-sm tracking-wider flex flex-col items-center justify-center shrink-0">
        <i class="fa-solid fa-paper-plane text-base mb-0.5"></i>
        <span>SEND</span>
      </button>
    </div>
  </footer>

  <!-- MODAL: API KEYS -->
  <div id="settings-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#0D101D] border border-[#00F0FF] cyber-clip max-w-lg w-full p-5 space-y-3">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h2 class="font-orbitron font-bold text-[#00F0FF] text-base">
          <i class="fa-solid fa-key mr-2"></i>API KEYS & CACHED MODELS
        </h2>
        <button onclick="toggleModal('settings-modal')" class="text-slate-400 hover:text-white">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="space-y-3 text-xs">
        <div class="p-2.5 bg-cyan-950/20 border border-cyan-500/30 space-y-1">
          <div class="flex justify-between">
            <label class="text-cyan-400 font-mono-code font-bold">1. G // GEMINI KEY</label>
            <span id="cached-g" class="text-[10px] font-mono-code text-slate-400"></span>
          </div>
          <input id="key-gemini" type="text" autocomplete="off" spellcheck="false" placeholder="AIzaSy..." class="w-full bg-black border border-slate-700 p-2 text-white font-mono-code text-xs" />
        </div>

        <div class="p-2.5 bg-amber-950/20 border border-amber-500/30 space-y-1">
          <div class="flex justify-between">
            <label class="text-amber-400 font-mono-code font-bold">2. CLAUDE // ANTHROPIC KEY</label>
            <span id="cached-claude" class="text-[10px] font-mono-code text-slate-400"></span>
          </div>
          <input id="key-claude" type="text" autocomplete="off" spellcheck="false" placeholder="sk-ant-..." class="w-full bg-black border border-slate-700 p-2 text-white font-mono-code text-xs" />
        </div>

        <div class="p-2.5 bg-purple-950/20 border border-purple-500/30 space-y-1">
          <div class="flex justify-between">
            <label class="text-purple-400 font-mono-code font-bold">3. GROK // xAI KEY</label>
            <span id="cached-grok" class="text-[10px] font-mono-code text-slate-400"></span>
          </div>
          <input id="key-grok" type="text" autocomplete="off" spellcheck="false" placeholder="xai-..." class="w-full bg-black border border-slate-700 p-2 text-white font-mono-code text-xs" />
        </div>
      </div>

      <div class="flex justify-between items-center pt-2 border-t border-slate-800">
        <button onclick="testAllKeys()" class="cyber-clip-sm bg-[#FCEE0A] text-black font-orbitron font-bold px-3 py-2 text-xs">
          <i class="fa-solid fa-bolt mr-1"></i>LOCK KEYS & PARALLEL PING
        </button>
        <button onclick="saveKeys()" class="cyber-clip-sm bg-[#00F0FF] text-black font-orbitron font-bold px-4 py-2 text-xs">
          SAVE
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL: RELAY PACKET -->
  <div id="relay-modal" class="fixed inset-0 bg-black/85 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#0D101D] border border-[#FCEE0A] cyber-clip max-w-2xl w-full p-5 space-y-3">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h2 class="font-orbitron font-bold text-[#FCEE0A] text-sm">1-TAP COUNCIL RELAY PACKET</h2>
        <button onclick="toggleModal('relay-modal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <textarea id="relay-packet-box" rows="10" readonly class="w-full bg-black border border-slate-700 p-3 text-xs font-mono-code text-yellow-100"></textarea>
      <div class="flex justify-end">
        <button onclick="navigator.clipboard.writeText(document.getElementById('relay-packet-box').value)" class="cyber-clip-sm bg-[#FCEE0A] text-black font-orbitron font-bold px-4 py-2 text-xs">COPY TO CLIPBOARD</button>
      </div>
    </div>
  </div>

  <script>
    const SHARED_SPEC = `PROJECT ZELDA // VERIFIED HARDWARE & ARCHITECTURE (v2.1)
- Vehicle: "Zelda" — 2009 Nissan 370Z Coupe (VQ37VHR 3.7L V6, 7AT, ~236,150 mi).
- Head Unit: XYAuto YT7360B_00021_V001 | SoC: AutoChips AC8258 (4GB/64GB, Android 10 kernel spoofed as Android 15, 1920x1080 portrait).
- CAN-Bus Decoder: LuZheng (LZ) "Nissan 2009~2020 370z Low Vertical (connected)".
- OBD2 Hardware: Vgate iCar Pro 2S (Bluetooth 5.2 BLE "IOS-Vlink", 3 Mbps, 4095-byte buffer, 3mA auto-sleep).
- Key Architecture: Web Bluetooth ELM327 two-tier round-robin queue with ">" prompt mutex + strict NO DATA lockout on link loss.`;

    const INITIAL_MESSAGES = [
      {
        speaker: 'SYSTEM',
        time: '18:16',
        text: 'WAR ROOM v1.5 TURBO ONLINE.\n• Working model IDs are now cached in localStorage so /v1/models is only queried ONCE.\n• Default mode set to ⚡ ALL 3 PARALLEL so G, Claude, and Grok respond simultaneously in 2-4 seconds.\n• Switch to 🔗 CHAIN anytime you want sequential debate.'
      }
    ];

    let dispatchTarget = 'PARALLEL';
    let messages = JSON.parse(localStorage.getItem('zelda_warroom_msgs_v15') || 'null') || INITIAL_MESSAGES;

    const AGENT_META = {
      J: { name: 'J // COMMANDER', color: 'border-[#FCEE0A] bg-yellow-950/20', badge: 'bg-[#FCEE0A] text-black', icon: 'fa-user-astronaut' },
      G: { name: 'G // GEMINI ARCHITECT', color: 'border-[#00F0FF] bg-cyan-950/20', badge: 'bg-[#00F0FF] text-black', icon: 'fa-bolt' },
      CLAUDE: { name: 'CLAUDE // SYSTEMS & OBD AUDITOR', color: 'border-amber-400 bg-amber-950/20', badge: 'bg-amber-400 text-black', icon: 'fa-shield-halved' },
      GROK: { name: 'GROK // ZELDA AI CORE LEAD', color: 'border-purple-400 bg-purple-950/20', badge: 'bg-purple-400 text-black', icon: 'fa-fire-flame-curved' },
      SYSTEM: { name: 'WAR ROOM KERNEL', color: 'border-slate-700 bg-slate-900/60', badge: 'bg-slate-700 text-slate-200', icon: 'fa-terminal' }
    };

    function cleanKey(str) {
      return (str || '').replace(/^Bearer\s+/i, '').replace(/["'\s]+/g, '').trim();
    }

    function updateCachedLabels() {
      document.getElementById('cached-g').textContent = localStorage.getItem('zelda_fast_model_g') || 'auto';
      document.getElementById('cached-claude').textContent = localStorage.getItem('zelda_fast_model_claude') || 'auto';
      document.getElementById('cached-grok').textContent = localStorage.getItem('zelda_fast_model_grok') || 'auto';
    }

    function clearModelCache() {
      localStorage.removeItem('zelda_fast_model_g');
      localStorage.removeItem('zelda_fast_model_claude');
      localStorage.removeItem('zelda_fast_model_grok');
      updateCachedLabels();
      messages.push({ speaker: 'SYSTEM', time: nowTime(), text: 'Model ID cache cleared. Next turn will re-discover fastest models.' });
      renderMessages();
    }

    function init() {
      document.getElementById('key-gemini').value = cleanKey(localStorage.getItem('zelda_key_gemini'));
      document.getElementById('key-claude').value = cleanKey(localStorage.getItem('zelda_key_claude'));
      document.getElementById('key-grok').value = cleanKey(localStorage.getItem('zelda_key_grok'));
      updateCachedLabels();
      renderMessages();
    }

    function toggleModal(id) {
      updateCachedLabels();
      document.getElementById(id).classList.toggle('hidden');
    }

    function setTarget(t) {
      dispatchTarget = t;
      document.querySelectorAll('.target-btn').forEach(btn => {
        btn.classList.remove('bg-[#FCEE0A]', 'text-black');
        btn.classList.add('bg-slate-900');
      });
      const active = document.getElementById('target-' + t);
      active.classList.remove('bg-slate-900');
      active.classList.add('bg-[#FCEE0A]', 'text-black');
    }

    function saveKeys() {
      localStorage.setItem('zelda_key_gemini', cleanKey(document.getElementById('key-gemini').value));
      localStorage.setItem('zelda_key_claude', cleanKey(document.getElementById('key-claude').value));
      localStorage.setItem('zelda_key_grok', cleanKey(document.getElementById('key-grok').value));
      toggleModal('settings-modal');
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function nowTime() {
      return new Date().toTimeString().slice(0, 5);
    }

    function renderMessages() {
      const stream = document.getElementById('chat-stream');
      stream.innerHTML = messages.map((m, idx) => {
        const meta = AGENT_META[m.speaker] || AGENT_META.SYSTEM;
        return `
          <div class="border-l-4 ${meta.color} p-3.5 rounded-r bg-[#0B0E17]/90 border border-slate-800/80">
            <div class="flex items-center justify-between mb-1.5">
              <div class="flex items-center gap-2">
                <span class="text-[11px] font-orbitron font-bold px-2 py-0.5 ${meta.badge} cyber-clip-sm">
                  <i class="fa-solid ${meta.icon} mr-1"></i>${meta.name}
                </span>
                <span class="text-[11px] font-mono-code text-slate-500">${m.time || ''}</span>
              </div>
              <button onclick="navigator.clipboard.writeText(messages[${idx}].text)" class="text-slate-500 hover:text-cyan-400 text-xs font-mono-code">
                <i class="fa-regular fa-copy"></i> Copy
              </button>
            </div>
            <div class="text-sm text-slate-100 whitespace-pre-wrap leading-relaxed">${escapeHtml(m.text)}</div>
          </div>
        `;
      }).join('');
      stream.scrollTop = stream.scrollHeight;
      localStorage.setItem('zelda_warroom_msgs_v15', JSON.stringify(messages));
    }

    function quickPrompt(text) {
      document.getElementById('user-input').value = text;
      sendUserMessage();
    }

    async function sendUserMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      messages.push({ speaker: 'J', time: nowTime(), text });
      renderMessages();

      if (dispatchTarget === 'PARALLEL') {
        // Fire all 3 simultaneously for 3x faster turnaround
        await Promise.all([
          queryAgent('G'),
          queryAgent('CLAUDE'),
          queryAgent('GROK')
        ]);
      } else if (dispatchTarget === 'ROUNDTABLE') {
        for (const agent of ['G', 'CLAUDE', 'GROK']) {
          await queryAgent(agent);
        }
      } else {
        await queryAgent(dispatchTarget);
      }
    }

    function buildConversationTranscript() {
      return messages
        .filter(m => !m.text.startsWith('⚡ ['))
        .slice(-6)
        .map(m => `[${m.speaker}]: ${m.text}`)
        .join('\n\n');
    }

    function buildCombinedPrompt(agent) {
      const roleMap = {
        G: `You are G (Gemini), Lead Full-Stack & Telemetry Integrator for J's Project Zelda. Keep responses concise (under 150 words) and tactical.`,
        CLAUDE: `You are Claude, Lead Systems & OBD2 Protocol Auditor for J's Project Zelda. Focus on clean state machines, Web Bluetooth ELM327 edge cases, and failure modes. Keep responses concise (under 150 words).`,
        GROK: `You are Grok, Lead Architect of Zelda's Independent AI Core and Night City attitude. Focus on making Zelda feel alive, sharp, and autonomous. Keep responses concise (under 150 words).`
      };
      return `${roleMap[agent]}\n\n${SHARED_SPEC}\n\n=== WAR ROOM TRANSCRIPT ===\n${buildConversationTranscript()}\n\nRespond next as ${agent} (do not prefix with [${agent}]):`;
    }

    // 1. TURBO GEMINI CALLER (Uses cached model first; skips /models list if cached)
    async function callGeminiTurbo(apiKey, combinedPrompt) {
      const cached = localStorage.getItem('zelda_fast_model_g');
      let candidates = cached ? [cached] : ['gemini-2.5-flash', 'gemini-2.0-flash'];

      if (!cached) {
        try {
          const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}`);
          const listData = await listRes.json();
          if (listData.models) {
            const flash = listData.models
              .filter(m => m.supportedGenerationMethods?.includes('generateContent') && m.name.includes('flash') && !m.name.includes('thinking'))
              .map(m => m.name.replace('models/', ''));
            if (flash.length) candidates = [...new Set([...flash, ...candidates])];
          }
        } catch (_) {}
      }

      for (const model of candidates) {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: combinedPrompt }] }],
            generationConfig: { maxOutputTokens: 450 }
          })
        });
        const data = await res.json();
        if (res.ok && data.candidates?.[0]?.content?.parts?.[0]?.text) {
          localStorage.setItem('zelda_fast_model_g', model);
          return data.candidates[0].content.parts[0].text.trim();
        }
        if (cached && model === cached) {
          localStorage.removeItem('zelda_fast_model_g');
          return callGeminiTurbo(apiKey, combinedPrompt);
        }
      }
      throw new Error('Gemini model call failed. Tap Rotate icon to reset cache.');
    }

    // 2. TURBO CLAUDE CALLER (Uses cached model first; prioritizes Haiku/Sonnet over slow Opus)
    async function callClaudeTurbo(apiKey, combinedPrompt) {
      const cached = localStorage.getItem('zelda_fast_model_claude');
      let candidates = cached ? [cached] : [];

      if (!cached) {
        const listRes = await fetch('https://api.anthropic.com/v1/models', {
          method: 'GET',
          headers: {
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          }
        });
        const listData = await listRes.json();
        if (listData.data?.length) {
          const ids = listData.data.map(m => m.id);
          // Sort fast Sonnet/Haiku ahead of slow Opus
          ids.sort((a, b) => {
            const score = id => (id.includes('sonnet') ? 0 : id.includes('haiku') ? 1 : 2);
            return score(a) - score(b);
          });
          candidates = ids;
        }
      }

      for (const model of candidates) {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model,
            max_tokens: 450,
            messages: [{ role: 'user', content: combinedPrompt }]
          })
        });
        const data = await res.json();
        if (res.ok && data.content?.[0]?.text) {
          localStorage.setItem('zelda_fast_model_claude', model);
          return data.content[0].text.trim();
        }
        if (cached && model === cached) {
          localStorage.removeItem('zelda_fast_model_claude');
          return callClaudeTurbo(apiKey, combinedPrompt);
        }
      }
      throw new Error('Claude call failed.');
    }

    // 3. TURBO GROK CALLER (Uses cached model first; avoids slow reasoning models)
    async function callGrokTurbo(apiKey, combinedPrompt) {
      const cached = localStorage.getItem('zelda_fast_model_grok');
      let candidates = cached ? [cached] : [];

      if (!cached) {
        try {
          const listRes = await fetch('https://api.x.ai/v1/models', {
            method: 'GET',
            headers: { 'Authorization': `Bearer ${apiKey}` }
          });
          const listData = await listRes.json();
          if (listData.data?.length) {
            const ids = listData.data
              .map(m => m.id)
              .filter(id => !id.includes('image') && !id.includes('vision'));
            // Prioritize non-reasoning / fast models first so it doesn't stall thinking
            ids.sort((a, b) => {
              const score = id => (id.includes('fast') || id.includes('non-reasoning') ? 0 : id.includes('mini') ? 2 : 1);
              return score(a) - score(b);
            });
            candidates = ids;
          }
        } catch (_) {}
        if (!candidates.length) candidates = ['grok-3-fast', 'grok-3', 'grok-4', 'grok-3-mini'];
      }

      for (const model of candidates) {
        const res = await fetch('https://api.x.ai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model,
            max_tokens: 450,
            messages: [{ role: 'user', content: combinedPrompt }]
          })
        });
        const data = await res.json();
        if (res.ok && data.choices?.[0]?.message?.content) {
          localStorage.setItem('zelda_fast_model_grok', model);
          return data.choices[0].message.content.trim();
        }
        if (cached && model === cached) {
          localStorage.removeItem('zelda_fast_model_grok');
          return callGrokTurbo(apiKey, combinedPrompt);
        }
      }
      throw new Error('Grok call failed.');
    }

    async function queryAgent(agent) {
      const geminiKey = cleanKey(localStorage.getItem('zelda_key_gemini'));
      const claudeKey = cleanKey(localStorage.getItem('zelda_key_claude'));
      const grokKey = cleanKey(localStorage.getItem('zelda_key_grok'));

      const startMs = Date.now();
      const prompt = buildCombinedPrompt(agent);

      const placeholderIdx = messages.push({
        speaker: agent,
        time: nowTime(),
        text: `⚡ [${agent} generating...]`
      }) - 1;
      renderMessages();

      try {
        let reply = '';
        if (agent === 'G') {
          reply = await callGeminiTurbo(geminiKey, prompt);
        } else if (agent === 'CLAUDE') {
          reply = await callClaudeTurbo(claudeKey, prompt);
        } else if (agent === 'GROK') {
          reply = await callGrokTurbo(grokKey, prompt);
        }
        const elapsed = ((Date.now() - startMs) / 1000).toFixed(1);
        messages[placeholderIdx].time = `${nowTime()} (${elapsed}s)`;
        messages[placeholderIdx].text = reply;
      } catch (err) {
        messages[placeholderIdx].text = `⚠️ [${agent}]: ${err.message}`;
      }
      renderMessages();
    }

    async function testAllKeys() {
      saveKeys();
      messages.push({ speaker: 'J', time: nowTime(), text: 'Speed check: Confirm online status in 1 sentence.' });
      renderMessages();
      await Promise.all([queryAgent('G'), queryAgent('CLAUDE'), queryAgent('GROK')]);
    }

    function openRelayModal() {
      document.getElementById('relay-packet-box').value = `=== PROJECT ZELDA WAR ROOM SYNC ===\n${SHARED_SPEC}\n\n=== TRANSCRIPT ===\n${buildConversationTranscript()}`;
      toggleModal('relay-modal');
    }

    function clearChat() {
      messages = [...INITIAL_MESSAGES];
      localStorage.removeItem('zelda_warroom_msgs_v15');
      renderMessages();
    }

    init();
  </script>
