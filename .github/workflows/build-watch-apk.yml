name: Build Zelda Watch Ultra & Fold 7 Health Bridge APKs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/*.yml'

permissions:
  contents: write

jobs:
  build-zelda-apks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Debug Keystore
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Generate Watch Ultra & Fold 7 Health Bridge Projects
        shell: python
        run: |
          import os

          root_dir = "zelda-android-suite"
          watch_pkg = root_dir + "/wear-app/src/main/java/com/example/zeldawatch"
          phone_pkg = root_dir + "/phone-bridge/src/main/java/com/example/zeldabridge"
          os.makedirs(watch_pkg, exist_ok=True)
          os.makedirs(phone_pkg, exist_ok=True)

          def save(path, raw):
              out = []
              for line in raw.strip().splitlines():
                  s = line.lstrip()
                  out.append(s[1:] if s.startswith("|") else s)
              with open(path, "w", encoding="utf-8") as f:
                  f.write("\n".join(out) + "\n")

          save(root_dir + "/settings.gradle.kts", """
          |pluginManagement {
          |    repositories { google(); mavenCentral(); gradlePluginPortal() }
          |}
          |dependencyResolutionManagement {
          |    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          |    repositories { google(); mavenCentral() }
          |}
          |rootProject.name = "ZeldaNeuralSuite"
          |include(":wear-app", ":phone-bridge")
          """)

          save(root_dir + "/build.gradle.kts", """
          |plugins {
          |    id("com.android.application") version "8.9.2" apply false
          |    id("org.jetbrains.kotlin.android") version "2.1.20" apply false
          |}
          """)

          save(root_dir + "/gradle.properties", """
          |org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
          |android.useAndroidX=true
          |android.nonTransitiveRClass=true
          """)

          save(root_dir + "/wear-app/build.gradle.kts", """
          |plugins {
          |    id("com.android.application")
          |    id("org.jetbrains.kotlin.android")
          |}
          |android {
          |    namespace = "com.example.zeldawatch"
          |    compileSdk = 36
          |    defaultConfig {
          |        applicationId = "com.example.zeldawatch"
          |        minSdk = 30
          |        targetSdk = 34
          |        versionCode = 12
          |        versionName = "4.8.2"
          |    }
          |    buildTypes {
          |        release {
          |            isMinifyEnabled = false
          |            signingConfig = signingConfigs.getByName("debug")
          |        }
          |    }
          |    lint {
          |        checkReleaseBuilds = false
          |        abortOnError = false
          |    }
          |    compileOptions {
          |        sourceCompatibility = JavaVersion.VERSION_17
          |        targetCompatibility = JavaVersion.VERSION_17
          |    }
          |    kotlinOptions { jvmTarget = "17" }
          |}
          |dependencies {
          |    implementation("androidx.core:core-ktx:1.13.1")
          |    implementation("androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1")
          |}
          """)

          save(root_dir + "/wear-app/src/main/AndroidManifest.xml", """
          |<?xml version="1.0" encoding="utf-8"?>
          |<manifest xmlns:android="http://schemas.android.com/apk/res/android">
          |    <uses-feature android:name="android.hardware.type.watch" />
          |    <uses-permission android:name="android.permission.INTERNET" />
          |    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          |    <uses-permission android:name="android.permission.RECORD_AUDIO" />
          |    <uses-permission android:name="android.permission.VIBRATE" />
          |    <uses-permission android:name="android.permission.BODY_SENSORS" />
          |    <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />
          |    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          |    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          |    <queries>
          |        <intent><action android:name="android.speech.RecognitionService" /></intent>
          |        <intent><action android:name="android.speech.action.RECOGNIZE_SPEECH" /></intent>
          |        <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
          |    </queries>
          |    <application
          |        android:allowBackup="true"
          |        android:icon="@android:drawable/ic_btn_speak_now"
          |        android:label="Zelda KITT"
          |        android:supportsRtl="true"
          |        android:theme="@android:style/Theme.DeviceDefault">
          |        <meta-data android:name="com.google.android.wearable.standalone" android:value="true" />
          |        <activity
          |            android:name=".ZeldaQuickVoiceActivity"
          |            android:exported="true"
          |            android:label="Zelda KITT"
          |            android:launchMode="singleTop"
          |            android:taskAffinity="">
          |            <intent-filter>
          |                <action android:name="android.intent.action.MAIN" />
          |                <category android:name="android.intent.category.LAUNCHER" />
          |            </intent-filter>
          |        </activity>
          |        <service
          |            android:name=".ZeldaComplicationService"
          |            android:exported="true"
          |            android:icon="@android:drawable/ic_btn_speak_now"
          |            android:label="Zelda Comm-Link"
          |            android:permission="com.google.android.wearable.permission.BIND_COMPLICATION_PROVIDER">
          |            <intent-filter>
          |                <action android:name="android.support.wearable.complications.ACTION_COMPLICATION_UPDATE_REQUEST" />
          |            </intent-filter>
          |            <meta-data
          |                android:name="android.support.wearable.complications.SUPPORTED_TYPES"
          |                android:value="SHORT_TEXT,MONOCHROMATIC_IMAGE,SMALL_IMAGE" />
          |            <meta-data
          |                android:name="android.support.wearable.complications.UPDATE_PERIOD_SECONDS"
          |                android:value="0" />
          |        </service>
          |    </application>
          |</manifest>
          """)

          save(watch_pkg + "/KittModulatorView.java", """
          |package com.example.zeldawatch;
          |
          |import android.content.Context;
          |import android.graphics.BlurMaskFilter;
          |import android.graphics.Canvas;
