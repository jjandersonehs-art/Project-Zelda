name: Build Zelda KITT Watch APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/*.yml'

permissions:
  contents: write

jobs:
  build-wear-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Debug Keystore
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Generate KITT Wear OS Project Files
        shell: python
        run: |
          import os

          base = "wear-app"
          pkg = base + "/app/src/main/java/com/example/zeldawatch"
          os.makedirs(pkg, exist_ok=True)

          def save(path, raw):
              out = []
              for line in raw.strip().splitlines():
                  s = line.lstrip()
                  out.append(s[1:] if s.startswith("|") else s)
              with open(path, "w", encoding="utf-8") as f:
                  f.write("\n".join(out) + "\n")

          save(base + "/settings.gradle.kts", """
          |pluginManagement {
          |    repositories { google(); mavenCentral(); gradlePluginPortal() }
          |}
          |dependencyResolutionManagement {
          |    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          |    repositories { google(); mavenCentral() }
          |}
          |rootProject.name = "ZeldaWatchLink"
          |include(":app")
          """)

          save(base + "/build.gradle.kts", """
          |plugins {
          |    id("com.android.application") version "8.6.1" apply false
          |    id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          |}
          """)

          save(base + "/gradle.properties", """
          |org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          |android.useAndroidX=true
          |android.nonTransitiveRClass=true
          """)

          save(base + "/app/build.gradle.kts", """
          |plugins {
          |    id("com.android.application")
          |    id("org.jetbrains.kotlin.android")
          |}
          |android {
          |    namespace = "com.example.zeldawatch"
          |    compileSdk = 34
          |    defaultConfig {
          |        applicationId = "com.example.zeldawatch"
          |        minSdk = 30
          |        targetSdk = 34
          |        versionCode = 9
          |        versionName = "4.7.5"
          |    }
          |    buildTypes {
          |        release {
          |            isMinifyEnabled = false
          |            signingConfig = signingConfigs.getByName("debug")
          |        }
          |    }
          |    compileOptions {
          |        sourceCompatibility = JavaVersion.VERSION_17
          |        targetCompatibility = JavaVersion.VERSION_17
          |    }
          |    kotlinOptions { jvmTarget = "17" }
          |}
          |dependencies {
          |    implementation("androidx.core:core-ktx:1.13.1")
          |    implementation("androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1")
          |}
          """)

          save(base + "/app/src/main/AndroidManifest.xml", """
          |<?xml version="1.0" encoding="utf-8"?>
          |<manifest xmlns:android="http://schemas.android.com/apk/res/android">
          |    <uses-feature android:name="android.hardware.type.watch" />
          |    <uses-permission android:name="android.permission.INTERNET" />
          |    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          |    <uses-permission android:name="android.permission.RECORD_AUDIO" />
          |    <uses-permission android:name="android.permission.VIBRATE" />
          |    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          |    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          |    <queries>
          |        <intent><action android:name="android.speech.RecognitionService" /></intent>
          |        <intent><action android:name="android.speech.action.RECOGNIZE_SPEECH" /></intent>
          |        <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
          |    </queries>
          |    <application
          |        android:allowBackup="true"
          |        android:icon="@android:drawable/ic_btn_speak_now"
          |        android:label="Zelda KITT"
          |        android:supportsRtl="true"
          |        android:theme="@android:style/Theme.DeviceDefault">
          |        <meta-data android:name="com.google.android.wearable.standalone" android:value="true" />
          |        <activity
          |            android:name=".ZeldaQuickVoiceActivity"
          |            android:exported="true"
          |            android:label="Zelda KITT"
          |            android:launchMode="singleTop"
          |            android:taskAffinity="">
          |            <intent-filter>
          |                <action android:name="android.intent.action.MAIN" />
          |                <category android:name="android.intent.category.LAUNCHER" />
          |            </intent-filter>
          |        </activity>
          |        <service
          |            android:name=".ZeldaComplicationService"
          |            android:exported="true"
          |            android:icon="@android:drawable/ic_btn_speak_now"
          |            android:label="Zelda Comm-Link"
          |            android:permission="com.google.android.wearable.permission.BIND_COMPLICATION_PROVIDER">
          |            <intent-filter>
          |                <action android:name="android.support.wearable.complications.ACTION_COMPLICATION_UPDATE_REQUEST" />
          |            </intent-filter>
          |            <meta-data
          |                android:name="android.support.wearable.complications.SUPPORTED_TYPES"
          |                android:value="SHORT_TEXT,MONOCHROMATIC_IMAGE,SMALL_IMAGE" />
          |            <meta-data
          |                android:name="android.support.wearable.complications.UPDATE_PERIOD_SECONDS"
          |                android:value="0" />
          |        </service>
          |    </application>
          |</manifest>
          """)

          save(pkg + "/KittModulatorView.java", """
          |package com.example.zeldawatch;
          |
          |import android.content.Context;
          |import android.graphics.Canvas;
          |import android.graphics.Color;
          |import android.graphics.Paint;
          |import android.graphics.RectF;
          |import android.view.View;
          |
          |public class KittModulatorView extends View {
          |    public static final int MODE_IDLE = 0;
          |    public static final int MODE_LISTENING = 1;
          |    public static final int MODE_THINKING = 2;
          |    public static final int MODE_SPEAKING = 3;
          |
          |    private int mode = MODE_IDLE;
          |    private float micLevel = 0.25f;
          |    private float wordPulseBoost = 0f;
          |
          |    private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
          |    private final RectF segRect = new RectF();
          |    private final RectF frameRect = new RectF();
          |
          |    public KittModulatorView(Context context) {
          |        super(context);
          |    }
          |
          |    public int getMode() {
          |        return mode;
          |    }
          |
          |    public void setMode(int newMode) {
          |        this.mode = newMode;
          |        postInvalidateOnAnimation();
          |    }
          |
          |    public void setMicLevel(float level) {
          |        this.micLevel = Math.max(0.18f, Math.min(1.0f, level));
          |    }
          |
          |    public void triggerWordPulse() {
          |        this.wordPulseBoost = 1.0f;
          |        postInvalidateOnAnimation();
          |    }
          |
          |    @Override
          |    protected void onDraw(Canvas canvas) {
          |        super.onDraw(canvas);
          |        float w = getWidth();
          |        float h = getHeight();
          |        long now = System.currentTimeMillis();
          |
          |        frameRect.set(6f, 6f, w - 6f, h - 6f);
          |        paint.setStyle(Paint.Style.FILL);
          |        paint.setColor(Color.parseColor("#07090F"));
          |        canvas.drawRoundRect(frameRect, 26f, 26f, paint);
          |
          |        paint.setStyle(Paint.Style.STROKE);
          |        paint.setStrokeWidth(2.5f);
          |        if (mode == MODE_SPEAKING || mode == MODE_THINKING) {
          |            paint.setColor(Color.parseColor("#FF1744"));
          |        } else if (mode == MODE_LISTENING) {
          |            paint.setColor(Color.parseColor("#00F0FF"));
          |        } else {
          |            paint.setColor(Color.parseColor("#334455"));
          |        }
          |        canvas.drawRoundRect(frameRect, 26f, 26f, paint);
          |        paint.setStyle(Paint.Style.FILL);
          |
          |        if (mode == MODE_THINKING) {
          |            int cols = 8;
          |            float padX = 22f;
          |            float gap = 6f;
          |            float boxW = (w - padX * 2f - gap * (cols - 1)) / cols;
          |            float boxH = h * 0.28f;
          |            float topY = (h - boxH) / 2f;
          |            float cycle = (now % 1100L) / 1100f;
          |            float tri = (cycle < 0.5f) ? (cycle * 2f) : ((1f - cycle) * 2f);
          |            float pos = tri * (cols - 1);
          |            for (int i = 0; i < cols; i++) {
          |                float alpha = Math.max(0.12f, 1f - Math.abs(i - pos) * 0.42f);
          |                paint.setColor(Color.argb((int) (alpha * 255), 255, 23, 68));
          |                float left = padX + i * (boxW + gap);
          |                segRect.set(left, topY, left + boxW, topY + boxH);
          |                canvas.drawRoundRect(segRect, 5f, 5f, paint);
          |            }
          |            postInvalidateOnAnimation();
          |            return;
          |        }
          |
          |        int halfPairs = 6;
          |        float[] colMultipliers = new float[]{0.68f, 1.0f, 0.68f};
          |        double t = now / 95.0;
          |        if (wordPulseBoost > 0.02f) {
          |            wordPulseBoost *= 0.86f;
          |        } else {
          |            wordPulseBoost = 0f;
          |        }
          |
          |        float baseEnergy;
          |        if (mode == MODE_SPEAKING) {
          |            float wave = 0.48f + 0.32f * (float) Math.abs(Math.sin(t)) + 0.20f * (float) Math.abs(Math.sin(t * 2.3));
          |            baseEnergy = Math.min(1f, wave + wordPulseBoost * 0.38f);
          |        } else if (mode == MODE_LISTENING) {
          |            baseEnergy = Math.max(0.18f, Math.min(1f, micLevel));
          |        } else {
          |            baseEnergy = 0.12f;
          |        }
          |
          |        float colW = w * 0.19f;
          |        float colGap = w * 0.07f;
          |        float startX = (w - (colW * 3f + colGap * 2f)) / 2f;
          |        float padY = 16f;
          |        float segGap = 4f;
          |        int totalSegs = halfPairs * 2;
          |        float segH = (h - padY * 2f - segGap * (totalSegs - 1)) / totalSegs;
          |        float centerY = h / 2f;
          |
          |        for (int c = 0; c < 3; c++) {
          |            float colPhase = (c == 1) ? 1f : (0.85f + 0.15f * (float) Math.sin(t * 1.7 + c));
          |            int activePairs = Math.max(1, (int) (baseEnergy * colMultipliers[c] * colPhase * halfPairs + 0.6f));
          |            float left = startX + c * (colW + colGap);
          |            for (int p = 0; p < halfPairs; p++) {
          |                boolean lit = p < activePairs;
          |                if (!lit) {
          |                    paint.setColor(Color.parseColor("#181D26"));
          |                } else if (mode == MODE_LISTENING) {
          |                    paint.setColor((p >= halfPairs - 1) ? Color.parseColor("#FCEE0A") : Color.parseColor("#00F0FF"));
          |                } else if (mode == MODE_SPEAKING) {
          |                    paint.setColor((p >= halfPairs - 1) ? Color.parseColor("#FCEE0A") : Color.parseColor("#FF1744"));
          |                } else {
          |                    paint.setColor(Color.parseColor("#661022"));
          |                }
          |                float upBottom = centerY - segGap / 2f - p * (segH + segGap);
          |                segRect.set(left, upBottom - segH, left + colW, upBottom);
          |                canvas.drawRoundRect(segRect, 3f, 3f, paint);
          |
          |                float dnTop = centerY + segGap / 2f + p * (segH + segGap);
          |                segRect.set(left, dnTop, left + colW, dnTop + segH);
          |                canvas.drawRoundRect(segRect, 3f, 3f, paint);
          |            }
          |        }
          |        if (mode != MODE_IDLE) {
          |            postInvalidateOnAnimation();
          |        }
          |    }
          |}
          """)

