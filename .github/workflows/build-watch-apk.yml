          |
          |    public int getMode() {
          |        return mode;
          |    }
          |
          |    public void setMode(int newMode) {
          |        this.mode = newMode;
          |        postInvalidateOnAnimation();
          |    }
          |
          |    public void setMicLevel(float level) {
          |        this.micLevel = Math.max(0.14f, Math.min(1.0f, level));
          |    }
          |
          |    public void triggerWordPulse() {
          |        this.wordPulseBoost = 1.0f;
          |        postInvalidateOnAnimation();
          |    }
          |
          |    private void updateGradientIfNeeded(int w) {
          |        if (w <= 0) return;
          |        if (w == lastW && mode == lastMode && activeShader != null) return;
          |        lastW = w;
          |        lastMode = mode;
          |
          |        int[] colors;
          |        if (mode == MODE_SPEAKING) {
          |            colors = new int[]{
          |                Color.parseColor("#00F0FF"),
          |                Color.parseColor("#B026FF"),
          |                Color.parseColor("#FF2CF7"),
          |                Color.parseColor("#00F0FF")
          |            };
          |        } else if (mode == MODE_THINKING) {
          |            colors = new int[]{
          |                Color.parseColor("#7C4DFF"),
          |                Color.parseColor("#FF1744"),
          |                Color.parseColor("#FF2CF7"),
          |                Color.parseColor("#00E5FF")
          |            };
          |        } else if (mode == MODE_LISTENING) {
          |            colors = new int[]{
          |                Color.parseColor("#00E5FF"),
          |                Color.parseColor("#7C4DFF"),
          |                Color.parseColor("#EA80FC"),
          |                Color.parseColor("#00F0FF")
          |            };
          |        } else {
          |            colors = new int[]{
          |                Color.parseColor("#005B7F"),
          |                Color.parseColor("#5E2B97"),
          |                Color.parseColor("#881B68"),
          |                Color.parseColor("#005B7F")
          |            };
          |        }
          |
          |        float[] positions = new float[]{0f, 0.35f, 0.7f, 1f};
          |        activeShader = new LinearGradient(0f, 0f, (float) w, 0f, colors, positions, Shader.TileMode.CLAMP);
          |        glowPaint.setShader(activeShader);
          |        corePaint.setShader(activeShader);
          |    }
          |
          |    @Override
          |    protected void onDraw(Canvas canvas) {
          |        super.onDraw(canvas);
          |        int wInt = getWidth();
          |        int hInt = getHeight();
          |        if (wInt <= 0 || hInt <= 0) return;
          |
          |        updateGradientIfNeeded(wInt);
          |
          |        float w = (float) wInt;
          |        float h = (float) hInt;
          |        float cy = h * 0.5f;
          |        long now = System.currentTimeMillis();
          |
          |        if (wordPulseBoost > 0.02f) {
          |            wordPulseBoost *= 0.88f;
          |        } else {
          |            wordPulseBoost = 0f;
          |        }
