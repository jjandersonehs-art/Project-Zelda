      - name: Install Gradle 8.11.1 & Compile All 3 Signed APKs
        shell: bash
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0" > /dev/null
          curl -sL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          cd zelda-android-suite
          set -o pipefail
          /opt/gradle-8.11.1/bin/gradle :car-hud:assembleRelease :wear-app:assembleRelease :phone-bridge:assembleRelease --no-daemon --console=plain 2>&1 | tee /tmp/gradle.log || { echo "=== EXACT COMPILER ERRORS ==="; grep -E "error: |^e: |FAILURE:" /tmp/gradle.log || true; exit 1; }
          cp car-hud/build/outputs/apk/release/car-hud-release.apk ../zelda-car-370z.apk
          cp wear-app/build/outputs/apk/release/wear-app-release.apk ../zelda-watch-ultra.apk
          cp phone-bridge/build/outputs/apk/release/phone-bridge-release.apk ../zelda-fold7-health-bridge.apk

      - name: Upload All 3 APKs to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete zelda-v5.0.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create zelda-v5.0.0 zelda-car-370z.apk zelda-watch-ultra.apk zelda-fold7-health-bridge.apk \
            --title "Project Zelda v5.0.0: 370Z Native Car Home Launcher APK + Watch Ultra + Fold 7 Bridge" \
            --notes "Complete v5.0.0 Suite: zelda-car-370z.apk now acts as a true Android Car Home Screen Launcher (CATEGORY_HOME + Instant Offline Cache Boot + Built-in App/System Drawer + Collision-Free Vgate OBD), alongside zelda-watch-ultra.apk and zelda-fold7-health-bridge.apk."
