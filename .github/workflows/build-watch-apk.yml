          |        float targetAmp;
          |        double speed;
          |        if (mode == MODE_SPEAKING) {
          |            double pulse = 0.42 + 0.30 * Math.abs(Math.sin(now / 115.0)) + 0.22 * Math.abs(Math.sin(now / 53.0));
          |            targetAmp = Math.min(1.0f, (float) pulse + wordPulseBoost * 0.35f);
          |            speed = now / 170.0;
          |        } else if (mode == MODE_LISTENING) {
          |            targetAmp = Math.max(0.22f, micLevel * 0.92f);
          |            speed = now / 210.0;
          |        } else if (mode == MODE_THINKING) {
          |            targetAmp = 0.38f + 0.16f * (float) Math.sin(now / 140.0);
          |            speed = now / 95.0;
          |        } else {
          |            targetAmp = 0.11f;
          |            speed = now / 420.0;
          |        }
          |
          |        smoothAmp += (targetAmp - smoothAmp) * 0.24f;
          |        float maxDisp = h * 0.43f * smoothAmp;
          |
          |        // Subtle glowing center horizon filament
          |        horizonPaint.setStrokeWidth(1.5f);
          |        horizonPaint.setColor(Color.argb(65, 0, 240, 255));
          |        canvas.drawLine(w * 0.04f, cy, w * 0.96f, cy, horizonPaint);
          |
          |        // 5 braided harmonic ribbons pinched cleanly at left/right edges (Shutterstock neon wave look)
          |        float[] freqs = new float[]{1.6f, 2.3f, 3.1f, 3.9f, 4.8f};
          |        float[] phases = new float[]{0.0f, 1.25f, 2.55f, 3.95f, 5.15f};
          |        float[] ampScales = new float[]{1.0f, 0.84f, 0.72f, 0.56f, 0.40f};
          |        float[] strokeWidths = new float[]{3.2f, 2.6f, 2.2f, 1.8f, 1.4f};
          |
          |        int steps = 56;
          |        float dx = w / steps;
          |
          |        for (int s = 0; s < 5; s++) {
          |            wavePath.reset();
          |            double phaseShift = speed * (s % 2 == 0 ? 1.0 : -0.82) + phases[s];
          |            float f = freqs[s];
          |            float aScale = ampScales[s];
          |
          |            for (int i = 0; i <= steps; i++) {
          |                float x = i * dx;
          |                float u = (float) i / (float) steps;
          |                // Smooth raised-cosine pinch envelope -> tapers to 0 at circular bezel edges
          |                double env = Math.pow(Math.sin(Math.PI * u), 1.65);
          |                double primary = Math.sin(u * Math.PI * 2.0 * f + phaseShift);
          |                double harmonic = 0.32 * Math.cos(u * Math.PI * 2.0 * (f * 0.5 + 1.0) - phaseShift * 0.7);
          |                float y = cy + (float) (env * maxDisp * aScale * (primary + harmonic) * 0.78);
          |
          |                if (i == 0) {
          |                    wavePath.moveTo(x, y);
          |                } else {
          |                    wavePath.lineTo(x, y);
          |                }
          |            }
          |
          |            glowPaint.setStrokeWidth(strokeWidths[s] * 3.1f);
          |            glowPaint.setAlpha(s < 2 ? 135 : 90);
          |            canvas.drawPath(wavePath, glowPaint);
          |
          |            corePaint.setStrokeWidth(strokeWidths[s]);
          |            corePaint.setAlpha(s == 0 ? 255 : 215);
          |            canvas.drawPath(wavePath, corePaint);
          |        }
          |
          |        if (mode != MODE_IDLE) {
          |            postInvalidateOnAnimation();
          |        } else {
          |            postInvalidateDelayed(48);
          |        }
          |    }
          |}
          """)

