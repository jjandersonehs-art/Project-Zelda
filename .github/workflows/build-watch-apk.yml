      - name: Install Gradle 8.11.1 & Compile Both Signed APKs
        shell: bash
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0" > /dev/null
          curl -sL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          cd zelda-android-suite
          /opt/gradle-8.11.1/bin/gradle :wear-app:assembleRelease :phone-bridge:assembleRelease --no-daemon --console=plain
          cp wear-app/build/outputs/apk/release/wear-app-release.apk ../zelda-watch-ultra.apk
          cp phone-bridge/build/outputs/apk/release/phone-bridge-release.apk ../zelda-fold7-health-bridge.apk

      - name: Upload Both APKs to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete watch-v4.8.2 --yes --cleanup-tag 2>/dev/null || true
          gh release create watch-v4.8.2 zelda-watch-ultra.apk zelda-fold7-health-bridge.apk \
            --title "Zelda v4.8.2: Neon Wave Watch APK + Fold 7 Health Connect Bridge APK" \
            --notes "Download zelda-watch-ultra.apk (for Galaxy Watch Ultra via Bugjaeger) and zelda-fold7-health-bridge.apk (install directly on Galaxy Z Fold 7 for Health Connect + GPS + 1-Tap API Key sync)."
