      - name: Install Gradle 8.9 & Compile Signed Wear APK
        shell: bash
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          cd wear-app
          /opt/gradle-8.9/bin/gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../zelda-watch-ultra.apk

      - name: Upload APK to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete watch-v4.7.2 --yes --cleanup-tag 2>/dev/null || true
          gh release create watch-v4.7.2 zelda-watch-ultra.apk \
            --title "Zelda KITT Watch Ultra Complication APK (v4.7.2)" \
            --notes "v4.7.2: KITT 3-Bar Voice Modulator + Larson Scanner, native Watch speaker TTS, and hands-free fluent conversation loop."
