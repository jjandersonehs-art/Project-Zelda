name: Build Zelda v5.0 Car Home Launcher, Watch Ultra & Fold 7 APKs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/*.yml'

permissions:
  contents: write

jobs:
  build-zelda-apks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Debug Keystore
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Generate 370Z Car Launcher, Watch Ultra & Fold 7 Projects
        shell: python
        run: |
          import os

          root_dir = "zelda-android-suite"
          car_pkg = root_dir + "/car-hud/src/main/java/com/example/zeldacar"
          watch_pkg = root_dir + "/wear-app/src/main/java/com/example/zeldawatch"
          phone_pkg = root_dir + "/phone-bridge/src/main/java/com/example/zeldabridge"
          os.makedirs(car_pkg, exist_ok=True)
          os.makedirs(watch_pkg, exist_ok=True)
          os.makedirs(phone_pkg, exist_ok=True)

          def save(path, raw):
              out = []
              for line in raw.strip().splitlines():
                  s = line.lstrip()
                  out.append(s[1:] if s.startswith("|") else s)
              with open(path, "w", encoding="utf-8") as f:
                  f.write("\n".join(out) + "\n")

          save(root_dir + "/settings.gradle.kts", """
          |pluginManagement {
          |    repositories { google(); mavenCentral(); gradlePluginPortal() }
          |}
          |dependencyResolutionManagement {
          |    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          |    repositories { google(); mavenCentral() }
          |}
          |rootProject.name = "ZeldaNeuralSuite"
          |include(":car-hud", ":wear-app", ":phone-bridge")
          """)

          save(root_dir + "/build.gradle.kts", """
          |plugins {
          |    id("com.android.application") version "8.9.2" apply false
          |    id("org.jetbrains.kotlin.android") version "2.1.20" apply false
          |}
          """)

          save(root_dir + "/gradle.properties", """
          |org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          |android.useAndroidX=true
          |android.nonTransitiveRClass=true
          """)

          save(root_dir + "/car-hud/build.gradle.kts", """
          |plugins {
          |    id("com.android.application")
          |    id("org.jetbrains.kotlin.android")
          |}
          |android {
          |    namespace = "com.example.zeldacar"
          |    compileSdk = 36
          |    defaultConfig {
          |        applicationId = "com.example.zeldacar"
          |        minSdk = 26
          |        targetSdk = 34
          |        versionCode = 15
          |        versionName = "5.0.0"
          |    }
          |    buildTypes {
          |        release {
          |            isMinifyEnabled = false
          |            signingConfig = signingConfigs.getByName("debug")
          |        }
          |    }
          |    lint {
          |        checkReleaseBuilds = false
          |        abortOnError = false
          |    }
          |    compileOptions {
          |        sourceCompatibility = JavaVersion.VERSION_17
          |        targetCompatibility = JavaVersion.VERSION_17
          |    }
          |    kotlinOptions { jvmTarget = "17" }
          |}
          |dependencies {
          |    implementation("androidx.core:core-ktx:1.15.0")
          |}
          """)

          save(root_dir + "/car-hud/src/main/AndroidManifest.xml", """
          |<?xml version="1.0" encoding="utf-8"?>
          |<manifest xmlns:android="http://schemas.android.com/apk/res/android">
          |    <uses-permission android:name="android.permission.INTERNET" />
          |    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          |    <uses-permission android:name="android.permission.WAKE_LOCK" />
          |    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
          |    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
          |    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          |    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          |    <uses-permission android:name="android.permission.RECORD_AUDIO" />
          |    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
          |    <uses-permission android:name="android.permission.CAMERA" />
          |
